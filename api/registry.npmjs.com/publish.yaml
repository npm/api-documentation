components:
  responses:
    PublishSuccess:
      description: Successful Publish
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum:
                  - true
paths:
  /{escapedPackageName}:
    parameters:
      - $ref: './api/shared-components.yaml#/components/parameters/EscapedPackageName'
      - $ref: './api/shared-components.yaml#/components/parameters/RequiredBearerToken'
    put:
      tags:
        - Publish
      summary: Publish a new version of a package
      description: |
        Publish a new package version directly to the registry.

        **Upcoming change in January 2027:** granular access tokens that bypass 2FA
        will no longer be able to publish new versions directly, including the first
        version of a new package.
        For direct publication, use trusted publishing, or an account with 2FA enabled
        (interactively or with a token without bypass 2FA) and complete any 2FA challenge.
        For automated staging, create a stage-only token and use
        `POST /-/stage/package/{package-name}`, followed by human-2FA approval.

        Stage-only Granular Access Tokens cannot publish new versions through this
        endpoint, even with `bypass_2fa: true`. Requests rejected by the publish-policy
        check return `403 Forbidden` with `E_STAGE_REQUIRED` in the error message.
        Earlier authentication or package authorization checks can return other errors,
        including `404 Not Found`. Rejected requests are not automatically redirected
        to staging. Use `POST /-/stage/package/{package-name}`
        (`npm stage publish`), followed by maintainer approval with 2FA.

        The stage-only policy restricts new-version publication. Existing authorization 
        and 2FA requirements still apply.
      operationId: publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  example: 'npm@2.0.0'
                  description: The name and version of the package being published
                name:
                  type: string
                  example: npm
                  description: The name of the package being published
                description:
                  type: string
                  example: a package manager for JavaScript
                  description: The description of the package being published
                'dist-tags':
                  type: object
                  description: dist-tag to apply for this new version
                  additionalProperties:
                    type: string
                    format: semver
                    description: version for this tag, must be the version being uploaded
                  example:
                    latest: 2.0.0
                dist:
                  type: object
                  properties:
                    integrity:
                      type: string
                      format: sha512
                      description: sha512 integrity string for this version's tarball
                      example: 'sha512-0p99G5Mu9FC3ixLarvgfU0O8xoc386LBll2UixE8rbSJrKRFoXbJFbGSOBN9exJiFXryiLDFFhCKjOOBxQ/dsQ=='
                    shasum:
                      type: string
                      format: sha1
                      description: sha1 hex digest for this version's tarball
                      example: f783874393588901af1a4824a145fa009f174d9d
                    tarball:
                      type: string
                      format: url
                      description: url for the tarball will live. This is overwritten by the registry.
                      example: https://registry.npmjs.org/npm/-/npm-2.0.0.tgz
                versions:
                  description: 'manifest (package.json) of the package to be published, indexed by the version being published'
                  additionalProperties:
                    type: object
                    properties:
                      name:
                        type: string
                        description: package name
                      version:
                        type: string
                        format: semver
                        description: version of the package being published
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: object
                        - type: array
                      description: other package.json content
                  example:
                    '2.0.0':
                      name: npm
                      version: 2.0.0
                      description: A package manager for node
                access:
                  type: string
                  example: public
                  enum:
                    - public
                    - restricted
                  description: Access level for this package. Whether it is public or not.
                _attachments:
                  type: object
                  description: Tarball and provenance attestation attachments
                  additionalProperties:
                    anyOf:
                      - type: object
                        properties:
                          content_type:
                            type: string
                            description: tarball content type
                            enum:
                              - 'application/octet-stream'
                          data:
                            type: string
                            format: base64
                            description: base64 content of the tarball for this version
                          length:
                            type: integer
                            description: length of the tarball data string
                      - type: object
                        properties:
                          content_type:
                            type: string
                            description: sigstore content type
                          data:
                            type: string
                            format: base64
                            description: base64 content of the provenance attestation for this version
                          length:
                            type: integer
                            description: length of the provenance data string
                  example:
                    'npm-2.0.0.tgz':
                      content_type: 'application/octet-stream'
                      data: ZXhhbXBsZQo=
                      length: 13
                    'npm-2.0.0.sigstore':
                      content_type: 'application/vnd.dev.sigstore.bundle+json;version=0.2'
                      data: ZXhhbXBsZQo=
                      length: 13
      security:
        - npmAccessToken: []
        - npmSessionToken: []
        - granularAccessToken: []
        - oidcIdToken: []
      responses:
        '200':
          $ref: '#/components/responses/PublishSuccess'
        '401':
          $ref: './api/shared-components.yaml#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden. Returned when the token's publish policy does not allow direct
            publishing, or when other authorization or 2FA requirements are not met.
            Publish-policy rejections include `E_STAGE_REQUIRED` in the error message
            and in the `npm-notice` header. Use staged publishing followed by
            maintainer approval with 2FA.
          headers:
            npm-notice:
              description: For publish-policy rejections, guidance to stage the version instead of publishing directly.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              example:
                success: false
                error: 'This token can only publish to a staging area. Run `npm stage publish` to publish this version, then approve it. (E_STAGE_REQUIRED)'
        '404':
          description: |
            The scoped package is missing or inaccessible. An `npm-notice` header may provide staging guidance.
